<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ММ — твой экран</title>
<style>
  body{margin:0;background:#0a0e20;color:#dfe6ff;font-family:Segoe UI,Arial;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px;box-sizing:border-box}
  .card{width:min(94vw,400px);border:3px solid #d4af37;border-radius:16px;padding:16px;background:linear-gradient(160deg,#141a35,#0a0e20);box-shadow:0 0 40px rgba(212,175,55,.3)}
  h1{color:#d4af37;font-size:16px;letter-spacing:2px;text-align:center;margin:0 0 8px}
  #role{font-size:26px;font-weight:900;text-align:center;margin:6px 0}
  #who{text-align:center;font-size:13px;opacity:.8}
  #event{min-height:38px;background:rgba(255,255,255,.06);border:1px solid rgba(212,175,55,.35);border-radius:10px;padding:8px;font-size:13px;text-align:center;margin:8px 0}
  .row{display:flex;justify-content:space-between;font-size:14px;padding:3px 2px}
  .row b{color:#ffd54f}
  #turn{text-align:center;font-size:13px;color:#8a93af;margin-top:8px}
  #status{font-size:11px;color:#8a93af;text-align:center;margin-top:8px;word-break:break-all}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
  .stat{background:rgba(255,255,255,.05);border-radius:8px;padding:6px;text-align:center;font-size:12px}
  .stat b{display:block;font-size:16px;color:#ffd54f}
  #top{margin-top:8px}
  #top .trow{display:flex;justify-content:space-between;font-size:13px;padding:2px 4px;background:rgba(255,255,255,.04);border-radius:6px;margin:2px 0}
  #top .trow b{color:#ff8a80}
  #remote{display:none;gap:8px;margin-top:12px}
  #remote button{flex:1;padding:12px 0;background:linear-gradient(180deg,#1a2340,#0d1226);border:2px solid #d4af37;color:#ffd54f;font-weight:900;font-size:14px;border-radius:10px;cursor:pointer}
  #remote button:disabled{opacity:.35;cursor:default}
  #remote2{display:none;gap:8px;margin-top:8px}
  #remote2 button{flex:1;padding:10px 0;background:linear-gradient(180deg,#1a2340,#0d1226);border:2px solid #b0bec5;color:#cfd8dc;font-weight:700;font-size:13px;border-radius:10px;cursor:pointer}
  #remote2 button:disabled{opacity:.35;cursor:default}
  #mmodal{display:none;margin-top:12px;border:2px solid #7cfc9a;border-radius:12px;padding:10px;background:rgba(124,252,154,.07)}
  #mm-title{font-size:13px;font-weight:900;color:#7cfc9a;text-align:center;margin-bottom:6px}
  #hand{display:none;margin-top:12px}
  #hand-row{display:flex;gap:6px;overflow-x:auto;padding:6px 2px;scroll-snap-type:x mandatory}
  #hand-row div{min-width:96px;scroll-snap-align:start;background:rgba(255,255,255,.07);border:1px solid rgba(212,175,55,.4);border-radius:10px;padding:8px;font-size:12px;text-align:center;cursor:pointer}
  #hand-row div.sel{border-color:#7cfc9a;box-shadow:0 0 12px rgba(124,252,154,.6)}
  #card-info{display:none;margin-top:6px;background:rgba(124,252,154,.08);border:1px solid rgba(124,252,154,.4);border-radius:10px;padding:8px;font-size:12px;text-align:center}
</style>
</head>
<body>
<div class="card">
  <h1>🕵️ MURDER MONOPOLY</h1>
  <div id="status">Подключение…</div>
  <div id="role" style="display:none"></div>
  <div id="who" style="display:none"></div>
  <div id="event" style="display:none"></div>
  <div id="dash" style="display:none">
    <div class="grid">
      <div class="stat">Монеты<b id="s-coins">0</b></div>
      <div class="stat">Подозрения<b id="s-sus">0</b></div>
      <div class="stat">Усталость<b id="s-fat">0</b></div>
      <div class="stat">Страх<b id="s-fear">0</b></div>
    </div>
    <div class="row"><span>🎟 Жетоны</span><b id="s-tok">0</b></div>
    <div id="turn"></div>
    <div id="top"></div>
  </div>
  <div id="mmodal">
    <div id="mm-title"></div>
    <div id="mm-btns"></div>
  </div>
  <div id="hand">
    <div style="font-size:11px;color:#8a93af;text-align:center">🃏 Тап = показать на мониторе · второй тап = сыграть · свайп = отмена</div>
    <div id="hand-row"></div>
    <div id="card-info"></div>
  </div>
  <div id="remote">
    <button id="btn-roll" disabled>🎲 Кубик</button>
    <button id="btn-end" disabled>✅ Ход</button>
  </div>
  <div id="remote2">
    <button id="btn-accuse" disabled>🚔 Обвинить</button>
    <button id="btn-mor" disabled>🎭 Мораль</button>
  </div>
</div>
<script>
window.onerror = function (m) { document.getElementById('status').textContent = '❌ JS: ' + m; };
var MM_NTFY = 'https://ntfy.sh';
var ROLN = { sheriff: '🚔 ШЕРИФ', murderer: '🔪 УБИЙЦА', civilian: '🕊 МИРНЫЙ', cop: '🦹 ПРОДАЖНЫЙ КОП' };
var st = document.getElementById('status');
var rdata = (location.hash.match(/r=([^&]+)/) || [])[1];
var room = (location.hash.match(/room=([A-Z0-9]+)/i) || [])[1];
var myName = null, cli = null, selKey = null;
function send(d) { if (cli && room) cli.publish('mm145_' + room + '_up', JSON.stringify({ name: myName, d: d })); }
function showRole(d) {
  myName = d.n;
  st.textContent = '🤫 Это твой секрет — никому не показывай!';
  var r = document.getElementById('role');
  r.style.display = 'block'; r.style.color = d.c || '#ffd54f';
  r.textContent = ROLN[d.r] || d.r;
  var w = document.getElementById('who'); w.style.display = 'block'; w.textContent = 'Ты играешь за: ' + d.n;
}
function onMsg(e) { try { var o = JSON.parse(e.data); handle(JSON.parse(o.message)); } catch (err) {} }
function handle(d) {
  if (d.type === 'role') showRole({ n: d.name, r: d.role, c: d.color });
  if (d.type === 'state') {
    var ev = document.getElementById('event'); ev.style.display = 'block'; ev.textContent = d.lastLog || '…';
    document.getElementById('dash').style.display = 'block';
    document.getElementById('remote').style.display = 'flex';
    document.getElementById('remote2').style.display = 'flex';
    document.getElementById('turn').textContent = 'Раунд ' + d.round + ' · ходит: ' + d.turn;
    var my = d.turn === myName;
    document.getElementById('btn-roll').disabled = !my;
    document.getElementById('btn-end').disabled = !my;
    document.getElementById('btn-accuse').disabled = !my;
    document.getElementById('btn-mor').disabled = !my;
    var top = document.getElementById('top');
    top.innerHTML = '';
    (d.top || []).forEach(function (t, i) {
      var el = document.createElement('div');
      el.className = 'trow';
      el.innerHTML = '<span>' + (i + 1) + '. ' + t.name + '</span><b>🚨 ' + t.sus + '</b>';
      top.appendChild(el);
    });
    var me = null;
    for (var i = 0; i < d.players.length; i++) if (d.players[i].name === myName) me = d.players[i];
    if (me) {
      document.getElementById('s-coins').textContent = me.coins;
      document.getElementById('s-sus').textContent = me.suspect;
      document.getElementById('s-fat').textContent = me.fatigue;
      document.getElementById('s-fear').textContent = me.fear;
      document.getElementById('s-tok').textContent = me.tokens;
    }
  }
  if (d.type === 'modal') {
    var box = document.getElementById('mmodal');
    box.style.display = 'block';
    document.getElementById('mm-title').textContent = '🖥 ' + d.title;
    var row = document.getElementById('mm-btns');
    row.innerHTML = '';
    d.buttons.forEach(function (t, i) {
      var b = document.createElement('button');
      b.textContent = t;
      b.style.cssText = 'display:block;width:100%;margin:4px 0;padding:10px;background:#101632;border:2px solid #d4af37;color:#ffd54f;font-weight:700;border-radius:10px;cursor:pointer';
      b.onclick = function () { send({ cmd: 'modal', i: i }); box.style.display = 'none'; };
      row.appendChild(b);
    });
  }
  if (d.type === 'hand') {
    document.getElementById('hand').style.display = 'block';
    var wrap = document.getElementById('hand-row');
    wrap.innerHTML = '';
    d.cards.forEach(function (c) {
      var el = document.createElement('div');
      el.textContent = c.name;
      el.onclick = function () {
        if (selKey === c.key) { send({ cmd: 'play', key: c.key }); selKey = null; document.getElementById('card-info').style.display = 'none'; }
        else {
          selKey = c.key;
          send({ cmd: 'preview', key: c.key });
          var info = document.getElementById('card-info');
          info.style.display = 'block';
          info.innerHTML = '<b>' + c.name + '</b>' + (c.desc ? '<br>' + c.desc : '') + '<br><i>второй тап = сыграть</i>';
        }
        [...wrap.children].forEach(function (x) { x.classList.toggle('sel', x === el && selKey); });
      };
      wrap.appendChild(el);
    });
  }
  if (d.type === 'text') { var ev2 = document.getElementById('event'); ev2.style.display = 'block'; ev2.textContent = d.text; }
}
var swipeT = null;
document.getElementById('hand-row').addEventListener('scroll', function () {
  clearTimeout(swipeT);
  swipeT = setTimeout(function () {
    if (selKey) { selKey = null; send({ cmd: 'preview', key: null }); document.getElementById('card-info').style.display = 'none'; }
  }, 250);
});
document.getElementById('btn-roll').onclick = function () { send({ cmd: 'roll' }); };
document.getElementById('btn-end').onclick = function () { send({ cmd: 'end' }); };
document.getElementById('btn-accuse').onclick = function () { send({ cmd: 'accuse' }); };
document.getElementById('btn-mor').onclick = function () { send({ cmd: 'mor' }); };
if (rdata) {
  try { showRole(JSON.parse(decodeURIComponent(escape(atob(rdata))))); }
  catch (e) { st.textContent = '❌ Ссылка повреждена — пересканируй QR.'; }
}
if (room) {
  cli = { publish: function (t, s) { fetch(MM_NTFY + '/' + t, { method: 'POST', body: s }); } };
  var esAll = new EventSource(MM_NTFY + '/mm145_' + room + '_down_all/sse');
  esAll.onmessage = onMsg;
  esAll.onerror = function () { st.textContent = '📡 переподключение…'; };
  if (myName) { var esMe = new EventSource(MM_NTFY + '/mm145_' + room + '_down_' + myName + '/sse'); esMe.onmessage = onMsg; }
  cli.publish('mm145_' + room + '_up', JSON.stringify({ type: 'hello', name: myName }));
  st.textContent = '🔗 На связи с городом: пульт активен.';
} else if (!rdata) {
  st.textContent = '❌ Нет данных — отсканируй QR заново.';
}
</script>
</body>
</html>
